[tasks.dev]
description = "Levanta SIGER completo con FastAPI, MariaDB y React"
run = "docker compose up --build"

[tasks.up]
description = "Levanta SIGER usando imágenes ya construidas"
run = "docker compose up"

[tasks.down]
description = "Detiene los servicios de SIGER"
run = "docker compose down"

[tasks.logs]
description = "Muestra los logs de la API y el frontend"
run = "docker compose logs -f api web"

[tasks.test]
description = "Ejecuta las pruebas del backend"
run = "cd backend && pytest -q"

[tasks.migrate]
description = "Aplica las migraciones de base de datos local"
run = "docker compose run --rm api alembic upgrade head"

[tasks.seed]
description = "Carga datos sintéticos sin reemplazar datos existentes"
run = "docker compose run --rm api python -m scripts.seed"

[tasks.api]
description = "Levanta solamente MariaDB y la API"
run = "docker compose up --build db api"

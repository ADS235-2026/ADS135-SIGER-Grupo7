services:
  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: siger-local-docker-secret
      FRONTEND_ORIGIN: http://localhost:8080
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
    environment:
      REACT_APP_API_URL: http://localhost:4000
    ports:
      - "8081:80"
    depends_on:
      - api
